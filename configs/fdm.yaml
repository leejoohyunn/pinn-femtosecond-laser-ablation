# FDM solver options (GUIDE.md Phase 2, §4.8; notes/decisions.md I-14, I-15, I-31).
# Physics/material values live in configs/materials/*.yaml, not here.

integrator: rk4        # I-31 (confirmed 2026-10-02): RK4 at Δt = 1 fs is the reference the PINN is judged
                       # against — converged to < 1e-3 vs Δt = 0.1 fs at 0.05 s/run. The paper's scheme,
                       # explicit Euler Δt = 1 fs, carries 0.6 % / 1.3 % L2RE and 6 % depth error of its own
                       # (GUIDE §3.3, 2.10 table); use `--integrator euler` to reproduce it.
dt_fs: null            # integration step; null → material grid dt_fs (1 fs). Must divide 1 fs (e.g. 0.1)
ne_floor_m3: 1.0e6     # T_e not updated where n_e < floor (GUIDE 2.3)

# times at which the r=z=0 metrics are reported (paper Table 2 / Table 3 times)
report_times_fs:
  glass: [50, 100, 150, 200]
  sic:   [50, 100, 200, 285]
  gan:   [50, 100, 150, 200]
